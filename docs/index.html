<style>
/* Layout: índice fixo de aulas à esquerda, uma aula por vez à direita; no celular o índice vira uma faixa rolável no topo */
:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --fg: #1a2233;
  --muted: #5b6579;
  --line: #dde1ea;
  --accent: #2f5fb3;
  --accent-soft: #e6edfa;
  --sun: #e8b931;
  --code-bg: #141b2b;
  --code-fg: #e3e8f2;
  --ok: #1f8a54;
  --ok-soft: #e2f4ea;
  --bad: #c23b3b;
  --bad-soft: #fbe7e7;
  --tok-kw: #8fb4ff;
  --tok-str: #f2cf6b;
  --tok-num: #ffa07a;
  --tok-com: #7b879c;
  --tok-fn: #7fe0c1;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1420; --surface: #171e2d; --fg: #e4e8f0; --muted: #98a2b6; --line: #2a3346;
    --accent: #8fb4ff; --accent-soft: #1f2b45; --sun: #f0c84a; --code-bg: #0a0e17; --code-fg: #e3e8f2;
    --ok: #5fd39a; --ok-soft: #15301f; --bad: #ff8a8a; --bad-soft: #3a1b1d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1420; --surface: #171e2d; --fg: #e4e8f0; --muted: #98a2b6; --line: #2a3346;
  --accent: #8fb4ff; --accent-soft: #1f2b45; --sun: #f0c84a; --code-bg: #0a0e17; --code-fg: #e3e8f2;
  --ok: #5fd39a; --ok-soft: #15301f; --bad: #ff8a8a; --bad-soft: #3a1b1d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
}
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
  display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 40px;
}
header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 2.2rem; line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
.brand .prompt { font-family: var(--font-mono); font-weight: 600; color: var(--sun); font-size: 0.7em; margin-right: 8px; vertical-align: 0.1em; }
.tag { color: var(--muted); margin: 4px 0 0; }
.progress { min-width: 220px; }
.progress-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; }
.toc-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc a {
  display: grid; grid-template-columns: 28px 1fr 16px; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px; color: var(--fg); text-decoration: none; font-size: 0.95rem;
}
.toc a:hover { background: var(--accent-soft); }
.toc a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toc .n { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.toc .done { color: var(--ok); font-size: 0.85rem; text-align: right; }

main { min-width: 0; }
.lesson-meta { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); letter-spacing: 0.04em; }
h2.lesson-title { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.15; margin: 4px 0 8px; text-wrap: balance; }
.goal { color: var(--muted); margin: 0 0 24px; max-width: 65ch; }
main section { margin-bottom: 32px; max-width: 72ch; }
main h3 { font-family: var(--font-display); font-weight: 500; font-size: 1.25rem; margin: 0 0 8px; }
main p { margin: 0 0 12px; }
code.i { font-family: var(--font-mono); font-size: 0.88em; background: var(--accent-soft); color: var(--accent); padding: 1px 6px; border-radius: 4px; }

.code { background: var(--code-bg); color: var(--code-fg); border-radius: 10px; overflow: hidden; margin: 12px 0 16px; }
.code-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--tok-com); border-bottom: 1px solid rgba(255,255,255,.08); }
.code-head button { font: inherit; color: var(--code-fg); background: transparent; border: 1px solid rgba(255,255,255,.18); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
.code-head button:hover { border-color: var(--sun); }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.9rem; line-height: 1.55; }
.code .out { border-top: 1px dashed rgba(255,255,255,.15); padding: 10px 16px 14px; font-family: var(--font-mono); font-size: 0.85rem; color: #b9c3d6; white-space: pre-wrap; }
.code .out::before { content: "saída"; display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--sun); margin-bottom: 4px; }
.kw { color: var(--tok-kw); } .str { color: var(--tok-str); } .num { color: var(--tok-num); } .com { color: var(--tok-com); font-style: italic; } .fn { color: var(--tok-fn); }

.box { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 20px; }
.box h3 { display: flex; align-items: center; gap: 8px; }
.pill { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 99px; background: var(--sun); color: #1a2233; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--accent); font-weight: 600; }
summary:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.quiz-q { font-weight: 600; margin-bottom: 12px; }
.opts { display: grid; gap: 8px; }
.opt {
  text-align: left; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt code { font-family: var(--font-mono); font-size: 0.9em; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.feedback { margin-top: 12px; font-weight: 500; }
.feedback.ok { color: var(--ok); } .feedback.no { color: var(--bad); }

.footer-nav { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 20px; max-width: 72ch; }
.btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 16px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.complete[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.btn[aria-disabled="true"] { opacity: .4; pointer-events: none; }

@media (max-width: 820px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; padding-block: 20px 48px; }
  nav.toc { position: static; }
  .toc ol { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 6px; }
  .toc a { grid-template-columns: auto auto auto; white-space: nowrap; border: 1px solid var(--line); }
  .brand { font-size: 1.8rem; }
  .progress { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1 class="brand"><span class="prompt">&gt;&gt;&gt;</span>Python do Zero</h1>
      <p class="tag">12 aulas curtas, do primeiro <code class="i">print()</code> até classes e um jogo completo.</p>
    </div>
    <div class="progress" aria-live="polite">
      <div class="progress-label"><span>Seu progresso</span><span id="prog-txt">0 / 12</span></div>
      <div class="bar"><span id="prog-bar"></span></div>
    </div>
  </header>

  <nav class="toc" aria-label="Aulas">
    <p class="toc-title">Aulas</p>
    <ol id="toc"></ol>
  </nav>

  <main id="lesson" tabindex="-1"></main>
</div>

<script>
const L = [
{
  id: "aula-1", t: "Primeiros passos", goal: "Instalar o Python, rodar seu primeiro programa e entender o que é print().",
  parts: [
    { h: "Onde rodar Python", p: [
      "Baixe o Python em <b>python.org</b> (versão 3). Depois, abra o terminal e digite <code class=\"i\">python3</code> (no Windows, <code class=\"i\">python</code>). Aparece o sinal <code class=\"i\">&gt;&gt;&gt;</code>: é o modo interativo, onde cada linha é executada na hora.",
      "Para programas maiores, escreva o código em um arquivo terminado em <code class=\"i\">.py</code> e rode com <code class=\"i\">python3 arquivo.py</code>. Se não quiser instalar nada, sites como o Replit ou o Google Colab rodam Python no navegador."
    ]},
    { h: "Mostrando texto na tela", p: ["A função <code class=\"i\">print()</code> mostra na tela o que estiver dentro dos parênteses. Texto vai entre aspas."],
      code: 'print("Olá, mundo!")\nprint("Estou aprendendo Python")\n# Linhas que começam com # são comentários e o Python ignora', out: "Olá, mundo!\nEstou aprendendo Python" },
  ],
  ex: { q: "Escreva um programa que mostre seu nome em uma linha e sua cidade na linha seguinte.", a: 'print("Ana Souza")\nprint("Recife")' },
  quiz: { q: "O que acontece com uma linha que começa com #?", o: ["Ela é mostrada na tela", "O Python ignora", "Dá erro"], c: 1, why: "Linhas com # são comentários: servem para quem lê o código, não para o computador." }
},
{
  id: "aula-2", t: "Variáveis e tipos", goal: "Guardar valores com nomes e conhecer os tipos básicos: texto, inteiro, decimal e booleano.",
  parts: [
    { h: "Uma variável é uma etiqueta", p: ["Você dá um nome a um valor usando <code class=\"i\">=</code>. Depois, usa o nome no lugar do valor."],
      code: 'nome = "Carlos"      # str (texto)\nidade = 30           # int (número inteiro)\naltura = 1.75        # float (decimal, com ponto)\nestudante = True     # bool (True ou False)\n\nprint(nome, idade, altura, estudante)\nprint(type(altura))', out: "Carlos 30 1.75 True\n<class 'float'>" },
    { h: "Juntando texto e variáveis", p: ["O jeito mais prático é a <b>f-string</b>: coloque um <code class=\"i\">f</code> antes das aspas e as variáveis entre chaves."],
      code: 'cidade = "Salvador"\nprint(f"Eu moro em {cidade}.")', out: "Eu moro em Salvador." },
  ],
  ex: { q: "Crie as variáveis produto e preco e mostre a frase: \"O café custa R$ 12.5\".", a: 'produto = "café"\npreco = 12.5\nprint(f"O {produto} custa R$ {preco}")' },
  quiz: { q: "Qual é o tipo de 3.14?", o: ["int", "str", "float", "bool"], c: 2, why: "Números com ponto decimal são do tipo float." }
},
{
  id: "aula-3", t: "Entrada e contas", goal: "Pedir dados ao usuário com input() e fazer operações matemáticas.",
  parts: [
    { h: "Operadores", p: ["Python funciona como uma calculadora. Repare em <code class=\"i\">//</code> (divisão inteira) e <code class=\"i\">%</code> (resto da divisão)."],
      code: 'print(7 + 3)   # soma\nprint(7 - 3)   # subtração\nprint(7 * 3)   # multiplicação\nprint(7 / 2)   # divisão\nprint(7 // 2)  # divisão inteira\nprint(7 % 2)   # resto\nprint(2 ** 3)  # potência', out: "10\n4\n21\n3.5\n3\n1\n8" },
    { h: "Lendo o teclado", p: ["<code class=\"i\">input()</code> sempre devolve texto. Para fazer contas, converta com <code class=\"i\">int()</code> ou <code class=\"i\">float()</code>."],
      code: 'ano = int(input("Em que ano você nasceu? "))\nprint(f"Em 2026 você faz {2026 - ano} anos.")', out: "Em que ano você nasceu? 1998\nEm 2026 você faz 28 anos." },
  ],
  ex: { q: "Peça dois números ao usuário e mostre a soma e a média deles.", a: 'a = float(input("Primeiro número: "))\nb = float(input("Segundo número: "))\nprint(f"Soma: {a + b}")\nprint(f"Média: {(a + b) / 2}")' },
  quiz: { q: "Quanto vale 17 % 5?", o: ["3.4", "3", "2", "12"], c: 2, why: "17 dividido por 5 dá 3 e sobra 2. O operador % devolve a sobra." }
},
{
  id: "aula-4", t: "Decisões com if", goal: "Fazer o programa escolher caminhos com if, elif e else.",
  parts: [
    { h: "Comparações", p: ["Comparações devolvem True ou False: <code class=\"i\">==</code> igual, <code class=\"i\">!=</code> diferente, <code class=\"i\">&gt;</code>, <code class=\"i\">&lt;</code>, <code class=\"i\">&gt;=</code>, <code class=\"i\">&lt;=</code>. Combine com <code class=\"i\">and</code>, <code class=\"i\">or</code> e <code class=\"i\">not</code>."] },
    { h: "if, elif, else", p: ["O bloco que pertence ao if fica <b>recuado com 4 espaços</b>. Em Python, o recuo faz parte da regra, não é só estética."],
      code: 'nota = 7.5\n\nif nota >= 7:\n    print("Aprovado")\nelif nota >= 5:\n    print("Recuperação")\nelse:\n    print("Reprovado")', out: "Aprovado" },
  ],
  ex: { q: "Peça a temperatura e mostre \"Frio\" abaixo de 18, \"Agradável\" de 18 a 28 e \"Calor\" acima de 28.", a: 't = float(input("Temperatura: "))\nif t < 18:\n    print("Frio")\nelif t <= 28:\n    print("Agradável")\nelse:\n    print("Calor")' },
  quiz: { q: "Qual símbolo compara se dois valores são iguais?", o: ["=", "==", "=>"], c: 1, why: "Um = guarda um valor na variável. Dois == comparam." }
},
{
  id: "aula-5", t: "Repetições", goal: "Repetir tarefas com for e while sem copiar e colar código.",
  parts: [
    { h: "for com range()", p: ["<code class=\"i\">range(1, 6)</code> gera os números de 1 a 5. O último número fica de fora."],
      code: 'for i in range(1, 6):\n    print(f"5 x {i} = {5 * i}")', out: "5 x 1 = 5\n5 x 2 = 10\n5 x 3 = 15\n5 x 4 = 20\n5 x 5 = 25" },
    { h: "while", p: ["<code class=\"i\">while</code> repete enquanto a condição for verdadeira. Cuidado para a condição mudar em algum momento, senão o laço nunca termina."],
      code: 'contagem = 3\nwhile contagem > 0:\n    print(contagem)\n    contagem -= 1\nprint("Fogo!")', out: "3\n2\n1\nFogo!" },
  ],
  ex: { q: "Mostre todos os números pares de 0 a 20.", a: 'for n in range(0, 21, 2):\n    print(n)\n\n# ou, com if:\nfor n in range(21):\n    if n % 2 == 0:\n        print(n)' },
  quiz: { q: "Quais números range(3) gera?", o: ["1, 2, 3", "0, 1, 2", "0, 1, 2, 3"], c: 1, why: "range começa em 0 e para antes do número indicado." }
},
{
  id: "aula-6", t: "Listas", goal: "Guardar vários valores em uma só variável e percorrer cada um deles.",
  parts: [
    { h: "Criando e acessando", p: ["Listas ficam entre colchetes. A posição (índice) começa em <b>0</b>. O índice -1 pega o último item."],
      code: 'frutas = ["maçã", "banana", "uva"]\nprint(frutas[0])\nprint(frutas[-1])\nprint(len(frutas))', out: "maçã\nuva\n3" },
    { h: "Mudando a lista", p: [],
      code: 'frutas = ["maçã", "banana"]\nfrutas.append("manga")   # adiciona no fim\nfrutas.remove("banana")  # remove pelo valor\n\nfor f in frutas:\n    print(f"Eu gosto de {f}")', out: "Eu gosto de maçã\nEu gosto de manga" },
  ],
  ex: { q: "Dada a lista notas = [8, 6.5, 9, 7], mostre a maior nota, a menor e a média.", a: 'notas = [8, 6.5, 9, 7]\nprint("Maior:", max(notas))\nprint("Menor:", min(notas))\nprint("Média:", sum(notas) / len(notas))' },
  quiz: { q: "Em cores = [\"azul\", \"verde\", \"rosa\"], o que é cores[1]?", o: ["azul", "verde", "rosa"], c: 1, why: "O índice 0 é \"azul\", então o índice 1 é \"verde\"." }
},
{
  id: "aula-7", t: "Dicionários", goal: "Guardar dados em pares de chave e valor, como uma ficha de cadastro.",
  parts: [
    { h: "Chave e valor", p: ["Dicionários ficam entre chaves. Você acessa o valor pelo nome da chave, não por posição."],
      code: 'aluno = {"nome": "Bia", "idade": 17, "curso": "Python"}\nprint(aluno["nome"])\n\naluno["idade"] = 18        # altera\naluno["cidade"] = "Natal"  # adiciona\n\nfor chave, valor in aluno.items():\n    print(f"{chave}: {valor}")', out: "Bia\nnome: Bia\nidade: 18\ncurso: Python\ncidade: Natal" },
  ],
  ex: { q: "Crie um dicionário com o estoque de três produtos (nome: quantidade) e mostre só os que têm menos de 5 unidades.", a: 'estoque = {"arroz": 12, "feijão": 3, "café": 4}\nfor produto, qtd in estoque.items():\n    if qtd < 5:\n        print(f"Repor {produto} ({qtd} restantes)")' },
  quiz: { q: "Como pegar o valor da chave \"preco\" do dicionário item?", o: ["item[0]", "item[\"preco\"]", "item.preco"], c: 1, why: "Em dicionários você usa colchetes com o nome da chave." }
},
{
  id: "aula-8", t: "Funções", goal: "Criar seus próprios comandos com def para reaproveitar código.",
  parts: [
    { h: "Definindo uma função", p: ["<code class=\"i\">def</code> cria a função. Os parâmetros ficam entre parênteses, e <code class=\"i\">return</code> devolve o resultado para quem chamou."],
      code: 'def area_retangulo(base, altura):\n    return base * altura\n\nprint(area_retangulo(4, 3))\nprint(area_retangulo(10, 2.5))', out: "12\n25.0" },
    { h: "Valor padrão", p: ["Um parâmetro pode ter valor padrão, usado quando ninguém informa outro."],
      code: 'def saudar(nome, saudacao="Olá"):\n    print(f"{saudacao}, {nome}!")\n\nsaudar("Rui")\nsaudar("Rui", "Bom dia")', out: "Olá, Rui!\nBom dia, Rui!" },
  ],
  ex: { q: "Crie a função eh_par(n) que devolve True se n for par e False se for ímpar.", a: 'def eh_par(n):\n    return n % 2 == 0\n\nprint(eh_par(4))  # True\nprint(eh_par(7))  # False' },
  quiz: { q: "O que o return faz?", o: ["Mostra o valor na tela", "Devolve o valor para quem chamou a função", "Repete a função"], c: 1, why: "return entrega o resultado. Para mostrar na tela, você ainda usa print()." }
},
{
  id: "arquivos", t: "Arquivos", goal: "Salvar dados em arquivos de texto e ler de volta, para não perder nada quando o programa fecha.",
  parts: [
    { h: "Escrevendo", p: ["<code class=\"i\">open()</code> abre um arquivo. O modo <code class=\"i\">\"w\"</code> cria ou apaga o conteúdo e escreve; <code class=\"i\">\"a\"</code> adiciona no fim. Com <code class=\"i\">with</code>, o arquivo é fechado sozinho no fim do bloco."],
      code: 'with open("compras.txt", "w", encoding="utf-8") as arq:\n    arq.write("arroz\\n")\n    arq.write("feijão\\n")\n\nwith open("compras.txt", "a", encoding="utf-8") as arq:\n    arq.write("café\\n")', out: "(nada na tela: o arquivo compras.txt foi criado com 3 linhas)" },
    { h: "Lendo", p: ["O modo <code class=\"i\">\"r\"</code> lê. Percorrer o arquivo com <code class=\"i\">for</code> entrega uma linha por vez; <code class=\"i\">.strip()</code> tira a quebra de linha do fim."],
      code: 'with open("compras.txt", "r", encoding="utf-8") as arq:\n    for linha in arq:\n        print("-", linha.strip())', out: "- arroz\n- feijão\n- café" },

const KEY = "python-do-zero-feitas";
let feitas = new Set();
try { feitas = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
function salvar() { try { localStorage.setItem(KEY, JSON.stringify([...feitas])); } catch (e) {} }

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const KW = "def|return|if|elif|else|for|while|in|import|from|as|break|continue|and|or|not|True|False|None|pass|try|except|finally|raise|with|class|self";
const BI = "print|input|int|float|str|len|range|type|max|min|sum|open";
const RX = new RegExp(`(#.*)|(f?"[^"\\n]*"|f?'[^'\\n]*')|\\b(\\d+(?:\\.\\d+)?)\\b|\\b(${KW})\\b|\\b(${BI})(?=\\()`, "g");
function hl(code) {
  let out = "", last = 0;
  code.replace(RX, (m, com, str, num, kw, fn, idx) => {
    out += esc(code.slice(last, idx));
    const cls = com ? "com" : str ? "str" : num ? "num" : kw ? "kw" : "fn";
    out += `<span class="${cls}">${esc(m)}</span>`;
    last = idx + m.length;
    return m;
  });
  return out + esc(code.slice(last));
}

function codeBlock(code, out, label) {
  const id = "c" + Math.random().toString(36).slice(2, 8);
  return `<div class="code"><div class="code-head"><span>${label}</span><button type="button" data-copy="${id}">Copiar</button></div>
    <pre id="${id}">${hl(code)}</pre>${out ? `<div class="out">${esc(out)}</div>` : ""}</div>`;
}

function renderToc(cur) {
  document.getElementById("toc").innerHTML = L.map((l, i) =>
    `<li><a href="#${l.id}" ${l.id === cur ? 'aria-current="page"' : ""}>
      <span class="n">${String(i + 1).padStart(2, "0")}</span><span>${l.t}</span>
      <span class="done" aria-label="${feitas.has(l.id) ? "concluída" : ""}">${feitas.has(l.id) ? "✓" : ""}</span></a></li>`).join("");
  const toc = document.getElementById("toc"), atual = toc.querySelector('[aria-current]');
  if (atual && toc.scrollWidth > toc.clientWidth) toc.scrollLeft = atual.parentElement.offsetLeft - toc.offsetLeft - 8;
  document.getElementById("prog-txt").textContent = `${feitas.size} / ${L.length}`;
  document.getElementById("prog-bar").style.width = (feitas.size / L.length * 100) + "%";
}

function render() {
  const h = location.hash.slice(1);
  let i = L.findIndex(l => l.id === h); if (i < 0) i = 0;
  const l = L[i], prev = L[i - 1], next = L[i + 1];
  const parts = l.parts.map(p => `<section><h3>${p.h}</h3>${p.p.map(t => `<p>${t}</p>`).join("")}${p.code ? codeBlock(p.code, p.out, "exemplo.py") : ""}</section>`).join("");
  document.getElementById("lesson").innerHTML = `
    <div class="lesson-meta">AULA ${i + 1} DE ${L.length}</div>
    <h2 class="lesson-title">${l.t}</h2>
    <p class="goal">${l.goal}</p>
    ${parts}
    <section class="box"><h3><span class="pill">Exercício</span> Sua vez</h3>
      <p>${esc(l.ex.q)}</p>
      <p style="color:var(--muted);font-size:.9rem">Tente no seu computador antes de abrir a resposta.</p>
      <details><summary>Ver uma resposta possível</summary>${codeBlock(l.ex.a, "", "resposta.py")}</details>
    </section>
    <section class="box"><h3><span class="pill">Quiz</span> Teste rápido</h3>
      <div class="quiz-q">${esc(l.quiz.q)}</div>
      <div class="opts">${l.quiz.o.map((o, k) => `<button type="button" class="opt" data-k="${k}"><code>${esc(o)}</code></button>`).join("")}</div>
      <div class="feedback" id="fb" aria-live="polite"></div>
    </section>
    <div class="footer-nav">
      <a class="btn" href="#${prev ? prev.id : ""}" ${prev ? "" : 'aria-disabled="true"'}>← Anterior</a>
      <button type="button" class="btn complete" id="done-btn" aria-pressed="${feitas.has(l.id)}">${feitas.has(l.id) ? "✓ Aula concluída" : "Marcar como concluída"}</button>
      <a class="btn primary" href="#${next ? next.id : ""}" ${next ? "" : 'aria-disabled="true"'}>Próxima →</a>
    </div>`;

  const main = document.getElementById("lesson");
  main.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    const k = +b.dataset.k, fb = document.getElementById("fb");
    if (k === l.quiz.c) {
      main.querySelectorAll(".opt").forEach(x => x.disabled = true);
      b.classList.add("right"); fb.className = "feedback ok"; fb.textContent = "Certo! " + l.quiz.why;
    } else {
      b.classList.add("wrong"); b.disabled = true; fb.className = "feedback no"; fb.textContent = "Ainda não. Tente outra opção.";
    }
  }));
  main.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => {
    const pre = document.getElementById(b.dataset.copy);
    navigator.clipboard.writeText(pre.textContent).then(() => { b.textContent = "Copiado"; setTimeout(() => b.textContent = "Copiar", 1500); })
      .catch(() => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
  }));
  document.getElementById("done-btn").addEventListener("click", () => {
    feitas.has(l.id) ? feitas.delete(l.id) : feitas.add(l.id); salvar(); render();
  });
  renderToc(l.id);
}

window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
render();
</script>
